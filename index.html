<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Flores para Bebeshita Sarah</title>
  <style>
    body {
      margin: 0;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      flex-direction: column;
      font-family: 'Segoe UI', sans-serif;
    }

    .scene {
      display: flex;
      gap: 50px;
      perspective: 1000px;
    }

    .flower {
      position: relative;
      width: 50px;
      height: 200px;
      transform-style: preserve-3d;
      animation: grow 3s ease-out forwards;
    }

    .stem {
      position: absolute;
      bottom: 0;
      width: 6px;
      height: 200px;
      background: green;
      border-radius: 3px;
      transform: translateZ(-10px);
    }

    .petal {
      width: 30px;
      height: 50px;
      background: radial-gradient(circle at center, #ff1a4b, #a8002c);
      position: absolute;
      border-radius: 50% 50% 0 0;
      transform-origin: bottom center;
      opacity: 0;
      animation: bloom 1s forwards;
    }

    .petal:nth-child(2)  { transform: rotate(0deg)    translateY(-30px); animation-delay: 1s; }
    .petal:nth-child(3)  { transform: rotate(60deg)   translateY(-30px); animation-delay: 1.2s; }
    .petal:nth-child(4)  { transform: rotate(120deg)  translateY(-30px); animation-delay: 1.4s; }
    .petal:nth-child(5)  { transform: rotate(180deg)  translateY(-30px); animation-delay: 1.6s; }
    .petal:nth-child(6)  { transform: rotate(240deg)  translateY(-30px); animation-delay: 1.8s; }
    .petal:nth-child(7)  { transform: rotate(300deg)  translateY(-30px); animation-delay: 2s; }

    .center {
      position: absolute;
      top: 50px;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      background: yellow;
      border-radius: 50%;
      opacity: 0;
      animation: fadeIn 1s forwards;
      animation-delay: 2.3s;
    }

    @keyframes grow {
      from { transform: scaleY(0); }
      to { transform: scaleY(1); }
    }

    @keyframes bloom {
      to { opacity: 1; }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .message {
      margin-top: 50px;
      font-size: 2.5em;
      color: #ff66aa;
      opacity: 0;
      animation: fadeIn 2s ease-in forwards;
      animation-delay: 3s;
      text-shadow: 0 0 10px #ff66aa;
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="flower"><div class="stem"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="center"></div></div>
    <div class="flower"><div class="stem"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="center"></div></div>
    <div class="flower"><div class="stem"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="center"></div></div>
    <div class="flower"><div class="stem"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="center"></div></div>
    <div class="flower"><div class="stem"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="center"></div></div>
  </div>

  <div class="message">Bebeshita Sarah ❤️</div>
</body>
</html>
